# DMARCula behind Apache. Replace __HOST__ and __PORT__.
# Needs: mod_proxy, mod_proxy_http, mod_headers  (Debian: a2enmod proxy proxy_http headers)
# HTTPS: run "certbot --apache -d __HOST__ --redirect" afterwards. Certbot copies this vhost
# into an SSL vhost, where "env=HTTPS" makes Apache send X-Forwarded-Proto: https.
<VirtualHost *:80>
    ServerName __HOST__

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:__PORT__/ timeout=120
    ProxyPassReverse / http://127.0.0.1:__PORT__/
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS

    LimitRequestBody 62914560
</VirtualHost>
