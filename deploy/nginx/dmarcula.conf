# DMARCula behind nginx. Replace __HOST__ and __PORT__.
# HTTPS: run "certbot --nginx -d __HOST__ --redirect" afterwards (it edits this file),
# or add "listen 443 ssl;" with your own ssl_certificate / ssl_certificate_key.
server {
    listen 80;
    server_name __HOST__;

    client_max_body_size 60m;        # manual report uploads

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
