services:
  undmarc:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://undmarc:${POSTGRES_PASSWORD:-undmarc}@db:5432/undmarc
    ports:
      - "8000:8000"
    volumes:
      - ./geoip:/geoip:ro   # optional GeoLite2-Country.mmdb / GeoLite2-ASN.mmdb
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: undmarc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-undmarc}
      POSTGRES_DB: undmarc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undmarc"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
