services:
  dmarcator:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dmarcator:${POSTGRES_PASSWORD:-dmarcator}@db:5432/dmarcator
    ports:
      - "8000:8000"
    volumes:
      - ./geoip:/geoip:ro   # optional GeoLite2-Country.mmdb / GeoLite2-ASN.mmdb
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dmarcator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmarcator}
      POSTGRES_DB: dmarcator
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmarcator"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
